<header class="bg-white border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
    <nav class="flex items-center justify-between">
      <div class="flex items-center">
        <a
          routerLink="/"
          class="text-2xl font-bold text-black hover:text-gray-700 transition-colors"
        >
          Product Catalog
        </a>
      </div>
      <div class="flex items-center space-x-6">
        <a
          routerLink="/"
          routerLinkActive="text-primary font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-gray-600 hover:text-primary transition-colors"
        >
          Home
        </a>
        <a
          routerLink="/about"
          routerLinkActive="text-primary font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-gray-600 hover:text-primary transition-colors"
        >
          About
        </a>
        <a
          routerLink="/cart"
          routerLinkActive="text-primary font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="relative flex items-center text-gray-600 hover:text-primary transition-colors"
          aria-label="View cart"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
            />
          </svg>
          @if (((totalCount$ | async) ?? 0) > 0) {
            <span
              class="absolute -top-2 -right-3 bg-primary text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center"
            >
              {{ totalCount$ | async }}
            </span>
          }
        </a>
      </div>
    </nav>
  </div>
</header>
